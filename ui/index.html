<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Combat Monitor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d0d0f;
  }

  body {
    color: #c8c8cc;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  /* ── Pinned: topbar fades out, circle+stats stay solid ── */
  /* Window-level transparency is handled by Win32 layered alpha  */
  #topbar { transition: opacity 0.45s ease; }
  body.is-pinned #topbar       { opacity: 0.06; }
  body.is-pinned:hover #topbar { opacity: 1; }

  /* ── Top bar ─────────────────────────────────────────── */
  #topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 6px;
    background: #111114;
    border-bottom: 1px solid #1e1e24;
  }

  #topbar input {
    background: #1a1a1f;
    border: 1px solid #2a2a32;
    border-radius: 4px;
    color: #c8c8cc;
    padding: 5px 9px;
    font-size: 14px;
    outline: none;
    width: 140px;
  }
  #topbar input:focus { border-color: #1D9E75; }
  #topbar input::placeholder { color: #44444a; }

  .btn {
    background: #1e1e26;
    border: 1px solid #2e2e3a;
    border-radius: 4px;
    color: #9090a0;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: #252530; color: #c8c8cc; }
  .btn.teal { border-color: #1D9E75; color: #1D9E75; }
  .btn.teal:hover { background: #1D9E7522; }
  .btn.red  { border-color: #A32D2D; color: #c04040; }
  .btn.red:hover  { background: #A32D2D22; }

  #mode-badge {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    white-space: nowrap;
  }
  #mode-badge.consistency { background: #3a2e0a; color: #E8A820; border: 1px solid #5a4a15; }
  #mode-badge.paper       { background: #0a2a20; color: #1D9E75; border: 1px solid #154030; }

  #paper-label { font-size: 12px; color: #555560; white-space: nowrap; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  #pin-btn {
    margin-left: auto;
    flex-shrink: 0;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s;
    padding: 2px 4px;
    line-height: 1;
  }
  #pin-btn:hover  { opacity: 1; }
  #pin-btn.active { opacity: 1; filter: drop-shadow(0 0 4px #5599ff); }

  #panel-btn {
    margin-left: 4px;
    flex-shrink: 0;
    background: none;
    border: none;
    font-size: 17px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.15s;
    padding: 2px 4px;
    line-height: 1;
  }
  #panel-btn:hover { opacity: 1; }

  /* Panel hidden: side panel collapses */
  #content.panel-hidden #side-panel { display: none; }

  /* ── Content area ────────────────────────────────────── */
  #content {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
    background: #0d0d0f;  /* solid when not pinned */
  }

  /* Column mode — HUD on top, panel below */
  #content.col-mode {
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }

  /* Row mode — HUD on left, panel on right */
  #content.row-mode {
    flex-direction: row;
    align-items: stretch;
  }

  /* ── HUD wrap ────────────────────────────────────────── */
  #hud-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .col-mode #hud-wrap { margin: 12px auto 0; }
  .row-mode #hud-wrap { margin: auto 0;      }

  #hud-canvas { display: block; }

  /* Status overlay */
  #status-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    font-size: 14px;
    color: #555560;
    pointer-events: none;
  }

  /* Crit floaters */
  #floater-host {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .crit-floater {
    position: absolute;
    font-weight: 700;
    white-space: nowrap;
    animation: floatUp 1.4s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0);     opacity: 1; }
    100% { transform: translateY(-60px); opacity: 0; }
  }

  /* ── Side panel ──────────────────────────────────────── */
  #side-panel {
    overflow-y: auto;
    overflow-x: hidden;
  }

  .col-mode #side-panel {
    width: 100%;
    padding: 10px 16px 12px;
    flex-shrink: 0;
  }

  /* Row mode — full panel */
  .row-mode:not(.compact-mode) #side-panel {
    flex: 0 0 270px;
    max-width: 270px;
    padding: 10px 12px;
    border-left: 1px solid #1a1a22;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Row mode — compact panel (icons+numbers only) */
  .compact-mode #side-panel {
    flex: 0 0 96px;
    max-width: 96px;
    padding: 6px 4px;
    border-left: 1px solid #1a1a22;
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }

  /* ── Mini stats bar ─────────────────────────────────── */
  #mini-stats {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    margin-bottom: 8px;
  }
  .col-mode #mini-stats  { flex-direction: row; }
  .row-mode:not(.compact-mode) #mini-stats { flex-direction: column; gap: 1px; }
  .compact-mode #mini-stats { flex-direction: column; gap: 0; margin-bottom: 4px; }

  .ms-item {
    background: #111116;
    border: 1px solid #1e1e26;
    border-radius: 5px;
    min-width: 0;
  }
  .col-mode .ms-item { flex: 1; padding: 6px 8px; text-align: center; }
  .row-mode:not(.compact-mode) .ms-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: 4px;
  }
  .compact-mode .ms-item {
    display: flex;
    align-items: center;
    background: none;
    border: none;
    border-bottom: 1px solid #151520;
    border-radius: 0;
    padding: 4px 4px;
    gap: 3px;
  }
  .compact-mode .ms-item::before {
    content: attr(data-abbr);
    font-size: 9px;
    color: #2e2e3e;
    text-transform: uppercase;
    width: 28px;
    flex-shrink: 0;
  }
  .ms-lbl {
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #44444e;
  }
  .col-mode .ms-lbl { font-size: 10px; margin-bottom: 3px; }
  .row-mode:not(.compact-mode) .ms-lbl { font-size: 11px; }
  .compact-mode .ms-lbl { display: none; }
  .ms-val {
    font-weight: 600;
    color: #b0b0ba;
  }
  .col-mode .ms-val { font-size: 19px; display: block; }
  .row-mode:not(.compact-mode) .ms-val { font-size: 17px; }
  .compact-mode .ms-val { font-size: 13px; flex: 1; text-align: right; }
  .ms-val.teal  { color: #1D9E75; }
  .ms-val.red   { color: #D85A30; }
  .ms-val.amber { color: #E8A820; }

  /* ── Incoming damage breakdown ──────────────────────── */
  #recv-breakdown { flex-shrink: 0; margin-bottom: 8px; }
  .compact-mode #recv-breakdown { display: none; }

  .recv-row {
    display: flex;
    align-items: baseline;
    gap: 0;
    padding: 4px 2px;
    border-bottom: 1px solid #0f0f14;
  }
  .recv-type {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2px;
    width: 72px;
    flex-shrink: 0;
  }
  .recv-pct {
    font-size: 12px;
    color: #6a6a78;
    width: 34px;
    text-align: right;
    flex-shrink: 0;
  }
  .recv-dps {
    font-size: 11px;
    color: #38384a;
    flex: 1;
    text-align: right;
  }

  /* ── NPC intel panel ─────────────────────────────────── */
  #npc-panel { flex: 1; min-height: 0; overflow-y: auto; }
  .compact-mode #npc-panel { display: none; }

  .npc-ph {
    font-size: 12px;
    color: #2a2a38;
    padding: 6px 2px;
  }
  #npc-hdr {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 7px;
    border-bottom: 1px solid #1a1a22;
  }
  .npc-faction-name {
    font-size: 13px;
    font-weight: 600;
    color: #c8c8cc;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tank-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    padding: 2px 5px;
    border-radius: 3px;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .tank-badge.shield { background: #0a1e38; color: #378ADD; border: 1px solid #1a3a5a; }
  .tank-badge.armor  { background: #2a1808; color: #E8A820; border: 1px solid #4a2e0a; }
  .tank-badge.omni   { background: #1a1a22; color: #888780; border: 1px solid #2e2e3e; }
  .tank-badge.varies { background: #1a1a22; color: #666660; border: 1px solid #2e2e3e; }

  .npc-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 6px;
  }
  .npc-lbl {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #303040;
    width: 52px;
    flex-shrink: 0;
    padding-top: 3px;
  }
  .pill-row { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; }
  .dtype-pill {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    border: 1px solid;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .npc-ew-text { font-size: 11px; color: #7a7a88; flex: 1; line-height: 1.5; }
  #npc-tip {
    font-size: 11px;
    color: #3a3a4e;
    line-height: 1.55;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #1a1a22;
  }

  /* ── Rare spawn alerts ───────────────────────────────── */
  #rare-section { flex-shrink: 0; margin-top: 4px; }
  .compact-mode #rare-section { display: none; }
  .sec-hdr {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #2a2a38;
    margin-bottom: 4px;
  }
  .rare-item {
    border-left: 2px solid;
    padding: 4px 7px;
    margin-bottom: 3px;
    background: #0c0c12;
    border-radius: 0 3px 3px 0;
  }
  .rare-item-top { display: flex; align-items: baseline; gap: 5px; }
  .rare-threat {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .rare-name { font-size: 12px; color: #9090a0; }
  .rare-notes { font-size: 10px; color: #44444e; margin-top: 1px; }

  /* compact-mode hides bottom-bar */
  .compact-mode #bottom-bar { display: none; }

  /* ── Bottom bar (reset + file) ───────────────────────── */
  #bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 6px;
    flex-shrink: 0;
  }
  #bottom-bar button {
    background: none;
    border: none;
    color: #33333e;
    font-size: 12px;
    cursor: pointer;
  }
  #bottom-bar button:hover { color: #666670; }
  #file-name { font-size: 10px; color: #252530; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <input id="paper-input" type="number" min="1" max="99999" placeholder="Paper DPS…" />
  <button class="btn teal" onclick="setPaper()">Set</button>
  <button class="btn red"  onclick="clearPaper()">Clear</button>
  <span id="mode-badge" class="consistency">Consistency mode</span>
  <span id="paper-label"></span>
  <button id="panel-btn" title="Toggle info panel" onclick="togglePanel()">⊟</button>
  <button id="pin-btn" title="Always on top" onclick="togglePin()">📌</button>
</div>

<!-- Content (HUD + side panel) -->
<div id="content" class="col-mode">

  <!-- HUD -->
  <div id="hud-wrap">
    <canvas id="hud-canvas"></canvas>
    <div id="floater-host"></div>
    <div id="status-overlay"></div>
  </div>

  <!-- Stats + NPC intel -->
  <div id="side-panel">

    <!-- Compact stat row -->
    <div id="mini-stats">
      <div class="ms-item" data-abbr="DPS">
        <div class="ms-lbl">DPS</div>
        <div class="ms-val teal" id="sv-dps">0</div>
      </div>
      <div class="ms-item" data-abbr="APP">
        <div class="ms-lbl">APP</div>
        <div class="ms-val" id="sv-app">—</div>
      </div>
      <div class="ms-item" data-abbr="RCV">
        <div class="ms-lbl">RECV</div>
        <div class="ms-val red" id="sv-recv">0</div>
      </div>
      <div class="ms-item" data-abbr="SESS">
        <div class="ms-lbl">SESS</div>
        <div class="ms-val" id="sv-sess">0:00</div>
      </div>
    </div>

    <!-- Incoming damage breakdown -->
    <div id="recv-breakdown" hidden>
      <div class="sec-hdr">Incoming damage</div>
      <div id="recv-rows"></div>
    </div>

    <!-- NPC intel -->
    <div id="npc-panel">
      <div id="npc-placeholder" class="npc-ph">Awaiting NPC intel…</div>
      <div id="npc-content" hidden>
        <div id="npc-hdr">
          <span id="npc-tank" class="tank-badge shield">SHIELD</span>
          <span id="npc-name" class="npc-faction-name"></span>
        </div>
        <div class="npc-row">
          <span class="npc-lbl">Deal</span>
          <div id="npc-deal" class="pill-row"></div>
        </div>
        <div class="npc-row">
          <span class="npc-lbl">They deal</span>
          <div id="npc-recv" class="pill-row"></div>
        </div>
        <div class="npc-row" id="npc-ew-row">
          <span class="npc-lbl">EW</span>
          <span id="npc-ew" class="npc-ew-text"></span>
        </div>
        <div id="npc-tip"></div>
      </div>
    </div>

    <!-- Rare spawn alerts -->
    <div id="rare-section" hidden>
      <div class="sec-hdr">Rare spawns</div>
      <div id="rare-list"></div>
    </div>

    <div id="bottom-bar">
      <button onclick="resetSession()">↺ Reset</button>
      <span id="file-name">—</span>
    </div>
  </div>

</div><!-- #content -->

<script>
// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const PI2 = Math.PI * 2;
const TOP = -Math.PI / 2;

const COLORS = {
  out_kinetic:   '#1D9E75',
  out_thermal:   '#5DCAA5',
  out_em:        '#378ADD',
  out_explosive: '#7F77DD',
  out_unknown:   '#888780',
  in_em:         '#EF9F27',
  in_thermal:    '#D85A30',
  in_kinetic:    '#888780',
  in_explosive:  '#534AB7',
  in_unknown:    '#444441',
  teal:          '#1D9E75',
  red_arc:       '#A32D2D',
  red_text:      '#D85A30',
  dim:           '#22222a',
  divider:       'rgba(255,255,255,0.18)',
};

const DTYPE_COLORS = {
  EM:        '#378ADD',
  Thermal:   '#5DCAA5',
  Kinetic:   '#1D9E75',
  Explosive: '#7F77DD',
  omni:      '#888780',
  varies:    '#555560',
};

const THREAT_COLORS = {
  normal: '#888780',
  elite:  '#EF9F27',
  rare:   '#7F77DD',
  boss:   '#D85A30',
};

const DTYPE_ORDER_OUT = ['Kinetic','Thermal','EM','Explosive','Unknown'];
const DTYPE_ORDER_IN  = ['EM','Thermal','Kinetic','Explosive','Unknown'];
const COLOR_OUT = { Kinetic: COLORS.out_kinetic, Thermal: COLORS.out_thermal, EM: COLORS.out_em, Explosive: COLORS.out_explosive, Unknown: COLORS.out_unknown };
const COLOR_IN  = { EM: COLORS.in_em, Thermal: COLORS.in_thermal, Kinetic: COLORS.in_kinetic, Explosive: COLORS.in_explosive, Unknown: COLORS.in_unknown };

const MAX_IN_DPS = 2000;
const ROW_MODE_HEIGHT_THRESHOLD  = 540; // switch to row layout below this height
const COMPACT_CIRCLE_THRESHOLD   = 220; // switch to compact panel if circle < this

// ---------------------------------------------------------------------------
// Elements
// ---------------------------------------------------------------------------
const canvas    = document.getElementById('hud-canvas');
const ctx       = canvas.getContext('2d');
const contentEl = document.getElementById('content');
const hudWrap   = document.getElementById('hud-wrap');
const sidePanel = document.getElementById('side-panel');

// ---------------------------------------------------------------------------
// Layout manager
// ---------------------------------------------------------------------------
let currentSize   = 300;
let isRowMode     = false;
let isCompactMode = false;

function updateLayout() {
  const W = contentEl.clientWidth;
  const H = contentEl.clientHeight;

  const wantRow = H < ROW_MODE_HEIGHT_THRESHOLD;

  let size, wantCompact = false;

  if (!wantRow) {
    // Column mode: circle fills width, stats go below (~260px)
    size = Math.max(120, Math.min(W - 24, H - 260));
  } else {
    // Row mode: try full panel (270px) first
    const sizeWithFull    = Math.max(100, Math.min(H - 8, W - 270 - 8));
    // If circle would be too small, try compact panel (96px)
    const sizeWithCompact = Math.max(100, Math.min(H - 8, W -  96 - 8));
    wantCompact = sizeWithFull < COMPACT_CIRCLE_THRESHOLD;
    size = wantCompact ? sizeWithCompact : sizeWithFull;
  }

  // Apply mode classes
  if (wantRow !== isRowMode) {
    isRowMode = wantRow;
    contentEl.classList.toggle('row-mode', isRowMode);
    contentEl.classList.toggle('col-mode', !isRowMode);
  }
  if (wantRow && wantCompact !== isCompactMode) {
    isCompactMode = wantCompact;
    contentEl.classList.toggle('compact-mode', isCompactMode);
  } else if (!wantRow && isCompactMode) {
    isCompactMode = false;
    contentEl.classList.remove('compact-mode');
  }

  size = Math.round(size);
  if (size !== currentSize || canvas.width !== size) {
    currentSize   = size;
    canvas.width  = size;
    canvas.height = size;
    hudWrap.style.width  = size + 'px';
    hudWrap.style.height = size + 'px';
  }

  if (lastState) draw(lastState);
}

const resizeObserver = new ResizeObserver(() => updateLayout());
resizeObserver.observe(contentEl);

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let pinned       = true;
let panelVisible = true;
let lastState    = null;
let shownCrits   = new Set();
let noLogDir     = (typeof window._CFG !== 'undefined') && window._CFG.noLogDir;

// Win32 layered-window alpha animation
const ALPHA_PINNED = 217;  // ~85%
const ALPHA_FULL   = 255;
let _curAlpha  = ALPHA_FULL;
let _alphaAnim = null;

function _stepAlpha(target) {
  if (_alphaAnim) { clearInterval(_alphaAnim); _alphaAnim = null; }
  if (_curAlpha === target) return;
  _alphaAnim = setInterval(() => {
    const delta = target - _curAlpha;
    const step  = Math.sign(delta) * Math.min(Math.abs(delta), 5);
    _curAlpha  += step;
    if (window.pywebview && window.pywebview.api)
      window.pywebview.api.set_window_alpha(_curAlpha);
    if (_curAlpha === target) { clearInterval(_alphaAnim); _alphaAnim = null; }
  }, 40);
}

document.body.addEventListener('mouseenter', () => { if (pinned) _stepAlpha(ALPHA_FULL); });
document.body.addEventListener('mouseleave', () => { if (pinned) _stepAlpha(ALPHA_PINNED); });

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function fmtNum(n) {
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(Math.round(n));
}

// ---------------------------------------------------------------------------
// Draw
// ---------------------------------------------------------------------------
function draw(s) {
  const size  = canvas.width;
  if (!size) return;
  const scale = size / 500;
  const cx = size / 2, cy = size / 2;

  const R_OUT    = 220 * scale;
  const W_OUT    = Math.max(6, 22 * scale);
  const R_IN     = 178 * scale;
  const W_IN     = Math.max(5, 16 * scale);
  const R_CENTER = 152 * scale;

  function arc(r, startRad, endRad, color, width, round) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, startRad, endRad, false);
    ctx.strokeStyle = color;
    ctx.lineWidth   = width;
    ctx.lineCap     = round ? 'round' : 'butt';
    ctx.stroke();
  }

  function drawDividers() {
    ctx.save();
    ctx.strokeStyle = COLORS.divider;
    ctx.lineWidth   = Math.max(1, 2 * scale);
    const drawDiv = (angle, r, w) => {
      const x1 = cx + Math.cos(angle) * (r - w/2 - 2*scale);
      const y1 = cy + Math.sin(angle) * (r - w/2 - 2*scale);
      const x2 = cx + Math.cos(angle) * (r + w/2 + 2*scale);
      const y2 = cy + Math.sin(angle) * (r + w/2 + 2*scale);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    };
    drawDiv(TOP,           R_OUT, W_OUT);
    drawDiv(TOP + Math.PI, R_OUT, W_OUT);
    drawDiv(TOP,           R_IN,  W_IN);
    drawDiv(TOP + Math.PI, R_IN,  W_IN);
    ctx.restore();
  }

  function drawTypeArc(order, colorMap, pcts, startAngle, spanRad, r, w) {
    let cur = startAngle;
    for (const dtype of order) {
      const pct = (pcts[dtype] || 0) / 100;
      if (pct <= 0) continue;
      const sweep = spanRad * pct;
      arc(r, cur, cur + sweep, colorMap[dtype], w);
      cur += sweep;
    }
    if (cur < startAngle + spanRad - 0.001) {
      arc(r, cur, startAngle + spanRad, COLORS.dim, w);
    }
  }

  ctx.clearRect(0, 0, size, size);

  const hasData = (s.total_outgoing > 0 || s.total_incoming > 0);

  // BG circle
  ctx.beginPath();
  ctx.arc(cx, cy, R_CENTER + 4*scale, 0, PI2);
  ctx.fillStyle = '#0d0d0f';
  ctx.fill();

  const outDps  = s.outgoing_dps  || 0;
  const inDps   = s.incoming_dps  || 0;
  const appPct  = s.application_pct || 0;
  const paperDps = s.paper_dps;
  const appMode  = s.application_mode;

  // ── Outer ring ───────────────────────────────────────
  arc(R_OUT, TOP,           TOP + Math.PI, COLORS.dim, W_OUT);
  arc(R_OUT, TOP + Math.PI, TOP + PI2,     COLORS.dim, W_OUT);

  if (appMode === 'paper' && paperDps) {
    arc(R_OUT, TOP, TOP + Math.PI, 'rgba(55,138,221,0.18)', W_OUT);
  }

  {
    let frac = appMode === 'paper' && paperDps && paperDps > 0
      ? Math.min(outDps / paperDps, 1.0)
      : Math.min(appPct / 100, 1.0);
    if (frac > 0) arc(R_OUT, TOP, TOP + Math.PI * frac, COLORS.teal, W_OUT, true);
  }

  {
    const frac = Math.min(inDps / MAX_IN_DPS, 1.0);
    if (frac > 0) arc(R_OUT, TOP + Math.PI, TOP + Math.PI + Math.PI * frac, COLORS.red_arc, W_OUT, true);
  }

  // ── Inner ring ───────────────────────────────────────
  arc(R_IN, TOP,           TOP + Math.PI, COLORS.dim, W_IN);
  arc(R_IN, TOP + Math.PI, TOP + PI2,     COLORS.dim, W_IN);
  drawTypeArc(DTYPE_ORDER_OUT, COLOR_OUT, s.outgoing_by_type, TOP,           Math.PI, R_IN, W_IN);
  drawTypeArc(DTYPE_ORDER_IN,  COLOR_IN,  s.incoming_by_type, TOP + Math.PI, Math.PI, R_IN, W_IN);
  drawDividers();

  const f = (sz, bold) => `${bold ? 'bold ' : ''}${Math.round(sz * scale)}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center';

  // ── Center text ──────────────────────────────────────
  if (!hasData) {
    // No combat yet — small unobtrusive hint
    ctx.fillStyle = '#252530';
    ctx.font = f(11);
    ctx.fillText('waiting for combat', cx, cy + 4*scale);
  } else {
    // Divider line
    ctx.beginPath();
    ctx.moveTo(cx - 90*scale, cy);
    ctx.lineTo(cx + 90*scale, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth   = 1;
    ctx.stroke();

    // Top — OUTGOING
    ctx.fillStyle = '#3a3a48';
    ctx.font = f(13);
    ctx.fillText('OUTGOING', cx, cy - 68*scale);

    ctx.fillStyle = COLORS.teal;
    ctx.font = f(46, true);
    ctx.fillText(Math.round(outDps), cx, cy - 26*scale);

    ctx.fillStyle = '#404050';
    ctx.font = f(13);
    const appLabel = appMode === 'paper'
      ? `${Math.round(appPct)}% applied`
      : `${Math.round(appPct)}% consistent`;
    ctx.fillText(appLabel, cx, cy - 10*scale);

    if (appMode === 'paper' && paperDps) {
      ctx.fillStyle = '#2a2a36';
      ctx.font = f(11);
      ctx.fillText(`paper: ${Math.round(paperDps)}`, cx, cy + 3*scale);
    }

    // Bottom — INCOMING
    ctx.fillStyle = '#3a3a48';
    ctx.font = f(13);
    ctx.fillText('INCOMING', cx, cy + 20*scale);

    ctx.fillStyle = COLORS.red_text;
    ctx.font = f(38, true);
    ctx.fillText(Math.round(inDps), cx, cy + 54*scale);

    ctx.fillStyle = '#404050';
    ctx.font = f(13);
    ctx.fillText('dps', cx, cy + 70*scale);
  }
}

// ---------------------------------------------------------------------------
// Mini stats + badge
// ---------------------------------------------------------------------------
function updateMiniStats(s) {
  document.getElementById('sv-dps').textContent  = Math.round(s.outgoing_dps);
  document.getElementById('sv-app').textContent  = Math.round(s.application_pct) + '%';
  document.getElementById('sv-recv').textContent = fmtNum(s.total_incoming);
  document.getElementById('sv-sess').textContent = fmtTime(s.session_seconds);
}

function updateBadge(s) {
  const badge = document.getElementById('mode-badge');
  const label = document.getElementById('paper-label');
  if (s.application_mode === 'paper' && s.paper_dps) {
    badge.className = 'paper';
    badge.textContent = 'Paper DPS mode';
    label.textContent = `${Math.round(s.paper_dps)} DPS set`;
  } else {
    badge.className = 'consistency';
    badge.textContent = 'Consistency mode';
    label.textContent = '';
  }
}

// ---------------------------------------------------------------------------
// Incoming damage breakdown
// ---------------------------------------------------------------------------
const RECV_ORDER = ['EM', 'Thermal', 'Kinetic', 'Explosive', 'Unknown'];

function updateRecvBreakdown(s) {
  const section = document.getElementById('recv-breakdown');
  const rows    = document.getElementById('recv-rows');

  const byPct = s.incoming_by_type    || {};
  const byDps = s.incoming_dps_by_type || {};

  const active = RECV_ORDER.filter(t => (byPct[t] || 0) > 0);
  if (active.length === 0) { section.hidden = true; return; }

  section.hidden = false;
  rows.innerHTML = active.map(t => {
    const pct = Math.round(byPct[t] || 0);
    const dps = byDps[t] || 0;
    const col = DTYPE_COLORS[t] || '#888';
    const dpsStr = dps >= 1 ? Math.round(dps) + '/s' : '—';
    return `<div class="recv-row">
      <span class="recv-type" style="color:${col}">${t}</span>
      <span class="recv-pct">${pct}%</span>
      <span class="recv-dps">${dpsStr}</span>
    </div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// NPC intel panel
// ---------------------------------------------------------------------------
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makePills(types, container) {
  container.innerHTML = '';
  for (const t of types) {
    const pill = document.createElement('span');
    pill.className = 'dtype-pill';
    const col = DTYPE_COLORS[t] || '#555568';
    pill.style.color = col;
    pill.style.borderColor = col + '88';
    pill.style.background  = col + '14';
    pill.textContent = t === 'omni' ? 'All types' : t === 'varies' ? 'Mixed' : t;
    container.appendChild(pill);
  }
}

function updateNPC(s) {
  const ph      = document.getElementById('npc-placeholder');
  const content = document.getElementById('npc-content');

  if (!s.current_faction || !s.faction_info) {
    ph.hidden      = false;
    content.hidden = true;
    document.getElementById('rare-section').hidden = true;
    return;
  }

  ph.hidden      = true;
  content.hidden = false;

  const fi = s.faction_info;
  document.getElementById('npc-name').textContent = s.current_faction;

  const tankEl = document.getElementById('npc-tank');
  const tank = (fi.tank || 'varies').toLowerCase();
  tankEl.textContent = tank.toUpperCase();
  tankEl.className = 'tank-badge ' + tank;

  makePills(fi.weak_to || [], document.getElementById('npc-deal'));
  makePills(fi.deals   || [], document.getElementById('npc-recv'));

  const ewRow  = document.getElementById('npc-ew-row');
  const ewText = document.getElementById('npc-ew');
  if (fi.ew && fi.ew.length > 0) {
    ewText.textContent = fi.ew.join(' · ');
    ewRow.hidden = false;
  } else {
    ewRow.hidden = true;
  }

  document.getElementById('npc-tip').textContent = fi.notes || '';

  // Rare alerts
  const rareSection = document.getElementById('rare-section');
  const rareList    = document.getElementById('rare-list');
  if (s.rare_alerts && s.rare_alerts.length > 0) {
    rareSection.hidden = false;
    rareList.innerHTML = s.rare_alerts.map(a => {
      const col = THREAT_COLORS[a.threat] || '#888';
      return `<div class="rare-item" style="border-left-color:${col}">
        <div class="rare-item-top">
          <span class="rare-threat" style="color:${col}">${a.threat.toUpperCase()}</span>
          <span class="rare-name">${escHtml(a.name)}</span>
        </div>
        <div class="rare-notes">${escHtml(a.notes || '')}</div>
      </div>`;
    }).join('');
  } else {
    rareSection.hidden = true;
  }
}

// ---------------------------------------------------------------------------
// Crit floaters
// ---------------------------------------------------------------------------
function spawnCrit(crit) {
  if (shownCrits.has(crit.timestamp)) return;
  shownCrits.add(crit.timestamp);

  const host  = document.getElementById('floater-host');
  const el    = document.createElement('div');
  el.className = 'crit-floater';

  const isOut = crit.direction === 'to';
  const amt   = crit.amount;
  const sz    = canvas.width;
  const scale = sz / 500;
  const fontSize = Math.min(22, Math.max(13, 13 + (amt / 2000) * 9)) * scale;

  el.style.fontSize = fontSize + 'px';
  el.style.color    = isOut ? '#1D9E75' : '#D85A30';
  el.textContent    = isOut ? `+${amt.toLocaleString()}` : `-${amt.toLocaleString()}`;

  const cx   = sz / 2;
  const baseY = sz * (0.40 + Math.random() * 0.20);
  const baseX = isOut
    ? cx + sz * (0.12 + Math.random() * 0.12)
    : cx - sz * (0.12 + Math.random() * 0.12) - fontSize * 3;

  el.style.left = baseX + 'px';
  el.style.top  = baseY + 'px';
  host.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function processCrits(crits) {
  if (!crits) return;
  for (const c of crits) spawnCrit(c);
  if (shownCrits.size > 200) {
    const arr = [...shownCrits];
    arr.splice(0, 100).forEach(k => shownCrits.delete(k));
  }
}

// ---------------------------------------------------------------------------
// Status overlay
// ---------------------------------------------------------------------------
function setStatus(msg) {
  const el = document.getElementById('status-overlay');
  el.style.display = msg ? 'flex' : 'none';
  el.textContent   = msg || '';
}

// ---------------------------------------------------------------------------
// Poll loop
// ---------------------------------------------------------------------------
let _pollFailing = false;

async function poll() {
  try {
    const s = await window.pywebview.api.get_state();
    lastState = s;
    _pollFailing = false;

    setStatus(noLogDir ? 'No EVE log directory found. Start EVE first.' : null);

    draw(s);
    updateMiniStats(s);
    updateRecvBreakdown(s);
    updateNPC(s);
    updateBadge(s);
    processCrits(s.recent_crits);
    document.getElementById('file-name').textContent = s.monitored_file || '—';
  } catch(e) {
    if (!_pollFailing) { _pollFailing = true; setStatus('Connecting to backend…'); }
  }
}

function startPoll() {
  if (window.pywebview && window.pywebview.api) {
    document.getElementById('pin-btn').classList.add('active');
    document.body.classList.add('is-pinned');
    window.pywebview.api.set_always_on_top(true);
    _curAlpha = ALPHA_PINNED;   // set_always_on_top already applied 217
    updateLayout();
    poll();
    setInterval(poll, 500);
  } else {
    setTimeout(startPoll, 100);
  }
}
window.addEventListener('pywebviewready', startPoll);
startPoll();

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
function setPaper() {
  const val = parseFloat(document.getElementById('paper-input').value);
  if (!isNaN(val) && val > 0) window.pywebview.api.set_paper_dps(val);
}
function clearPaper() {
  document.getElementById('paper-input').value = '';
  window.pywebview.api.clear_paper_dps();
}
function resetSession() {
  window.pywebview.api.reset_session();
  shownCrits.clear();
}
function togglePin() {
  pinned = !pinned;
  document.getElementById('pin-btn').classList.toggle('active', pinned);
  document.body.classList.toggle('is-pinned', pinned);
  window.pywebview.api.set_always_on_top(pinned);
  if (pinned) {
    _curAlpha = ALPHA_FULL;
    _stepAlpha(ALPHA_PINNED);
  } else {
    if (_alphaAnim) { clearInterval(_alphaAnim); _alphaAnim = null; }
    _curAlpha = ALPHA_FULL;
  }
}

function togglePanel() {
  panelVisible = !panelVisible;
  contentEl.classList.toggle('panel-hidden', !panelVisible);
  document.getElementById('panel-btn').textContent = panelVisible ? '⊟' : '⊞';
  updateLayout();
}
document.getElementById('paper-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') setPaper();
});

// Initial blank draw (will be redrawn once layout runs)
updateLayout();
draw({
  outgoing_dps: 0, incoming_dps: 0,
  paper_dps: null, application_pct: 0, application_mode: 'consistency',
  outgoing_by_type: {}, incoming_by_type: {},
  session_seconds: 0, total_outgoing: 0, total_incoming: 0,
  target_list: [], recent_crits: [],
});
</script>
